# Release: on a `v*` tag, build the sdist and wheel with `uv build` and attach them to the
# workflow run as artifacts. This is a private product: there is NO PyPI publish step.
# The container image (Dockerfile lands in P7) is stubbed below, commented out.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Check the tag matches pyproject version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PYV="$(uv run --no-project --python 3.12 python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG pyproject=$PYV"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$TAG" != "$PYV" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PYV"; exit 1
          fi
      - name: uv build
        run: uv build --sdist --wheel --out-dir dist
      - name: Smoke-install the wheel and import the core
        run: |
          uv venv -q .smoke --python 3.12
          uv pip install -q dist/*.whl --python .smoke/bin/python
          .smoke/bin/python -c "import crb.core, crb.core.version as v; print('crb', v.__version__, 'apparatus', v.APPARATUS_VERSION)"
      - name: Record checksums
        run: |
          cd dist && sha256sum * | tee SHA256SUMS
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: crb-dist-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 365

