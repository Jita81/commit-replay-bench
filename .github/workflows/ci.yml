# CI gates for crb. Every job is a gate; none may be weakened without an ADR
# (see docs/CONTRIBUTING.md "never weaken a gate").
#
# Jobs:
#   lint      ruff check + ruff format --check
#   types     mypy --strict over src/crb
#   code-map  every source file carries a valid Navigation header; docs/CODE-MAP.md current
#   dod       every page/journey/stream + the product carry a definition of done; docs/dod/GAP-ANALYSIS.md current
#   claims    every quantified sentence on an allowlisted public page carries a permitted tag,
#             and a [measured] one carries its n, its method and its apparatus version
#   (commit-subjects lives in commit-subjects.yml: it must re-run when a pull request's
#             title is edited, and an edit should not re-run this whole workflow)
#   layers    import-linter: crb.core is stdlib-only; layers depend downward only
#   test-shard     the hermetic suite (pytest -m "not sandbox_images") split six ways per Python
#                  version (3.12, 3.13) by scripts/ci_test_shards.py — whole test files,
#                  longest-first over the measured seconds in scripts/ci_test_weights.json, so
#                  every shard computes the same partition and the six are balanced. Each shard
#                  uploads its report (every id it collected, the ids it ran) and its coverage
#                  data. The shards are not required contexts
#   test           the required contexts "test (py3.12)" and "test (py3.13)": an aggregator per
#                  version that passes only when every shard passed, the six reports prove every
#                  collected test ran in exactly one non-empty shard (`ci_test_shards.py verify`),
#                  and the shards' combined coverage is >= 70 — the single job's gate, on the
#                  same data. It ran as one job per version until py3.13 took 58 of its 60
#                  minutes on PR #57 (docs/PREVENTION.md P-053)
#   ui-unit   the UI's own gates: `npm ci`, `npm run typecheck` (tsc -b) and `npx vitest run`.
#             The hint ratchet, the native-`title=` allowlist and every screen suite run
#             there, so a hint-registry, a copy or a type regression fails a build instead of
#             waiting for someone to run the gates by hand before a release
#   ui-smoke  the mocked Playwright smoke spec (ui/e2e/smoke.spec.ts) over the built bundle:
#             the axe sweep of /login, the index redirect signed in and signed out, and the
#             end-to-end 404. No server and no model — `page.route` answers every API call
#   security  gitleaks (secrets in history) + pip-audit on the resolved environment
#   sbom      CycloneDX SBOM of the resolved environment, uploaded as an artifact
#   test-postgres  the store suite (tests/test_store_*.py) against a real PostgreSQL 16 service
#   container      hadolint + docker buildx build of deploy/Dockerfile (no push), image smoke
#                  (non-root, read-only root, migrate, UI present), helm lint, compose config —
#                  always runs (~2–4 min) and is blocking; the same Dockerfile is what
#                  release.yml pushes to GHCR on a tag
#   sandbox-images hadolint + docker buildx build (no push) of every reference sandbox image
#                  under deploy/sandbox, then the smoke that matters: the fixture repository of
#                  each language through DockerExecutor ON THAT IMAGE (uid 65534, read-only
#                  root, network off, qualify + grade clean — tests/test_sandbox_images_docker.py),
#                  the sandbox + sealed-builder suites on the python one, and the dependency
#                  provisioning suites (ADR-0019: a real fetch from an offline mirror into a
#                  sealed set, then each fixture offline on its image); a skip in the
#                  smoke fails the job. Always runs, and blocks a merge like `container`. The
#                  `test-shard` jobs deselect the `sandbox_images` marker: these tests build
#                  images, and this job builds each exactly once with the GHA layer cache
#   walkthrough    the required context "walkthrough (browser, live stack, tier 1)": an aggregator
#                  that passes only when `walkthrough-story` and every `walkthrough-screens`
#                  shard passed (a failed, cancelled or skipped part fails it), so the whole
#                  walkthrough stays under the one context main already requires
#   walkthrough-story  the full-browser walkthrough (ui/e2e/walkthrough) against a LIVE stack
#                  that scripts/walkthrough.sh boots in a temp dir — tier 1: hermetic, no
#                  network, no model (fixture repo over file://, test-only fixture_gold
#                  builder); the Playwright report + traces are uploaded on failure. It runs the
#                  stateful story — every spec except 11-screens, in order
#   walkthrough-screens  11-screens (every route x persona x width) split four ways by persona
#                  (CRB_E2E_SCREENS_SHARD=k/4), each shard on a stack of its own that the
#                  spec seeds through the API; the four run in parallel beside the story
#   job budget     `test-shard`, `test`, `walkthrough-story` and `walkthrough-screens` start a
#                  clock in their first step and end with scripts/ci_job_budget.py: past 80 % of
#                  the job's own timeout-minutes it writes an alarm into the job summary and the
#                  job fails — a job that creeps to its timeout blocks every merge, so it is
#                  split before it gets there (docs/PREVENTION.md P-051, P-053). No guard only
#                  warns: tests/test_ci_job_budget.py fails the build if one does
#
# Required contexts: every job in this file except `test-shard`, `walkthrough-story` and
# `walkthrough-screens` (the parts behind the `test` and `walkthrough` aggregators) is on main's
# required-checks list — lint, types, code-map, dod, claims, layers, test (py3.12), test (py3.13),
# ui-unit, ui-smoke, security, sbom, test-postgres, container, sandbox-images and walkthrough:
# 16 contexts, read from the repository setting on 2026-09-27. The list is a repository setting
# only an administrator can change (docs/DEPLOYMENT.md §3.4 names the call); a part of a split
# job is never added to it — its name changes with the split, the aggregator's does not.
#
# Actions are pinned by major tag; Dependabot keeps them current (.github/dependabot.yml).
# mypy and ruff are pinned exactly in the dev extra and moved by the same Dependabot; the
# daily scheduled run catches any other dependency whose new release moves a verdict.

name: ci

on:
  push:
    branches: [main, "reboot/**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
  # Daily on main with nothing changed: the dependencies are resolved fresh on every run, so
  # an upstream release can move a gate's verdict with no commit (SQLAlchemy 2.1.0, published
  # 2026-09-24, turned eight untyped query results into mypy errors on an unchanged tree).
  # The scheduled run finds that the day it happens and names the release, instead of
  # failing the next unrelated pull request. The gate tools themselves are pinned exactly.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_SYSTEM_PYTHON: "0"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install (dev extras)
        run: |
          uv venv -q .venv --python 3.12
          uv pip install -q -e '.[dev]' --python .venv/bin/python
      - name: ruff check
        run: .venv/bin/ruff check src tests
      - name: ruff format --check
        run: .venv/bin/ruff format --check src tests

  types:
    name: types (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      # mypy checks src/crb (server + store included): without the server and postgres
      # extras every fastapi / sqlalchemy / pydantic import is `import-not-found` (95 of
      # them, 277 errors with the cascades — measured 2026-09-14) and the gate measures
      # the environment, not the types.
      - name: Install (server + postgres + dev extras)
        run: |
          uv venv -q .venv --python 3.12
          uv pip install -q -e '.[server,postgres,mcp,dev]' --python .venv/bin/python
      - name: mypy
        run: .venv/bin/mypy

  code-map:
    name: code-map (every file has a valid header; docs/CODE-MAP.md is current)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # --changed-since diffs the pull request against its base branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Headers present, links resolve, map current
        run: python scripts/code_map.py --check
      # On a pull request, a file in scripts/code_map_onboarding_baseline.txt that the change
      # edits must leave it, and no path may join it (P-114); a push has no base to diff.
      - name: No edited or added onboarding-baseline entry
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/code_map.py --check --changed-since "origin/$BASE_REF"

  # GitHub truncates a check-run name at 100 characters, and branch protection matches the
  # FULL name — a longer one can never satisfy a required context (it blocked PR #48). Every
  # job name in every workflow stays under 100 characters: tests/test_ci_job_names.py fails
  # the `test` job otherwise (docs/PREVENTION.md P-001).
  dod:
    name: dod (every route, journey and stream has its definition of done; evidence resolves)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # the artefacts' history vouches for each retired gap id, and the base branch's
          # committed gap analysis for one a squash merge dropped (STANDARD.md §6, P-127)
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Artefacts valid, evidence resolves, docs/dod/GAP-ANALYSIS.md current
        env:
          DOD_BASE: origin/${{ github.base_ref || 'main' }}
        run: python scripts/dod_check.py --check

  claims:
    name: claims (every quantified sentence on a covered page carries its tag)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The fence reader is a CommonMark parser, not a hand-rolled one: PR #54's review found
      # five ways a line-by-line reader let a fence hide real review actions. Pinned to the
      # version the tests run against; pyproject's dev extra carries the same package.
      - name: Install the CommonMark parser the fence reader uses
        run: python -m pip install -q 'markdown-it-py==4.2.0'
      # The pages covered are scripts/claims_check.py's ALLOWLIST; the rest of the
      # documentation is ungated and the gap analysis (G-929) says so.
      - name: Every claim on a covered page carries what its tag requires
        run: python scripts/claims_check.py --check

  layers:
    name: layers (import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install (dev extras)
        run: |
          uv venv -q .venv --python 3.12
          uv pip install -q -e '.[dev]' --python .venv/bin/python
      - name: lint-imports (crb.core stdlib-only; layers downward only)
        run: .venv/bin/lint-imports

  test-shard:
    # The hermetic suite, split six ways per Python version. It ran as one job per version
    # until py3.13 took 58 of its 60 minutes on PR #57 (P-053). Each shard runs the SAME
    # command the single job ran — `-m "not sandbox_images"` and nothing else deselected —
    # plus the shard plugin, which keeps only this shard's test files: longest-first over the
    # measured per-file seconds in scripts/ci_test_weights.json, so the six are balanced and
    # every shard computes the same partition. ~9 min of tests + ~2 min setup per shard,
    # estimated from PR #57's two test-job logs: under half of this budget. No shard enforces
    # coverage (a sixth of the suite covers less than the whole): `test (py…)` combines the
    # six shards' coverage data and fails under 70 % on the union, exactly as the single job
    # did. The shards are not required contexts — the `test` aggregators are.
    name: test shard (py${{ matrix.python }}, ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # A toolchain warm-up (npm install, Maven resolution, docker build) that fails here
      # is a repository defect, not missing infrastructure: fail, never skip.
      CRB_TEST_STRICT_WARMUP: "1"
    steps:
      - name: Start the job-budget clock
        run: echo "CRB_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # fixture replays and mining tests walk git history
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      # The suite covers the server routes and the store (SQLite here; PostgreSQL in
      # test-postgres): the server and postgres extras are part of what is under test.
      - name: Install (server + postgres + dev extras)
        run: |
          uv venv -q .venv --python ${{ matrix.python }}
          uv pip install -q -e '.[server,postgres,mcp,dev]' --python .venv/bin/python
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.email "ci@crb.invalid"
          git config --global user.name "crb ci"
          git config --global init.defaultBranch main
      # the chart suites render deploy/helm/crb (tests/test_deploy_secrets_store.py fails on
      # CI without helm rather than skip: one secrets store for the api and worker, P-043)
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: pytest (this shard's test files; coverage data for the union)
        # `sandbox_images` builds the reference sandbox images; the sandbox-images job builds
        # each once (cached) and runs exactly those tests on it — nothing is skipped in CI.
        # --cov-fail-under=0 only because the threshold is the union's, enforced in `test`.
        # The shard options take `=`: pytest reads its config file before it loads the
        # plugin, so a value after a space would be taken for a test path (the plugin refuses).
        env:
          PYTHONPATH: scripts
        run: >-
          .venv/bin/pytest -q -m "not sandbox_images"
          -p ci_test_shards --shard=${{ matrix.shard }}/6
          --shard-report=shard-report/shard-${{ matrix.shard }}.json
          --cov=crb --cov-branch --cov-report= --cov-fail-under=0
      - name: Keep this shard's report and coverage data for `test (py${{ matrix.python }})`
        if: always()
        run: |
          mkdir -p shard-report
          if [ -f .coverage ]; then mv .coverage "shard-report/shard-${{ matrix.shard }}.coverage"; fi
          ls -la shard-report
      # not continue-on-error: without every shard's report and coverage data the aggregator
      # can prove neither the partition nor the 70 %, and it fails
      - name: Upload the shard report + coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-py${{ matrix.python }}-${{ matrix.shard }}
          path: shard-report
          if-no-files-found: error
          retention-days: 1
      - name: Job budget (fails past 80 % of timeout-minutes)
        if: always()
        run: python3 scripts/ci_job_budget.py --timeout-minutes 30 --mode fail

  test:
    # The required contexts "test (py3.12)" and "test (py3.13)": branch protection matches the
    # name character for character, so the split shards report under names of their own and
    # this job carries the required one. It passes only when (1) every shard succeeded — a
    # failed, cancelled or skipped shard fails it; `needs` on a matrix job waits for every
    # leg of BOTH versions, so a red py3.13 shard also fails `test (py3.12)`: stricter, never
    # looser; (2) this version's six reports prove the shards are one exact partition of the
    # collected suite — every test in exactly one shard, none empty, all six collecting the
    # same suite (scripts/ci_test_shards.py verify); (3) the six shards' coverage data,
    # combined, is at least 70 % — the single job's gate, on the same data. `if: always()`
    # so it runs, and fails, when a shard failed or was cancelled: a skipped required check
    # does not block a merge. tests/test_ci_test_shards.py holds all of this in place.
    name: test (py${{ matrix.python }})
    needs: [test-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Start the job-budget clock
        run: echo "CRB_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Every shard passed (both Python versions)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | length > 0 and all(.value.result == "success")'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install (dev extras — the coverage the shards measured with)
        run: |
          uv venv -q .venv --python ${{ matrix.python }}
          uv pip install -q -e '.[dev]' --python .venv/bin/python
      - name: Download every shard's report + coverage data (this Python version)
        uses: actions/download-artifact@v8
        with:
          pattern: test-shard-py${{ matrix.python }}-*
          path: shards
          merge-multiple: true
      - name: Every test ran in exactly one shard (the partition proof)
        run: >-
          python3 scripts/ci_test_shards.py verify --shards 6 --python ${{ matrix.python }}
          shards/shard-1.json shards/shard-2.json shards/shard-3.json
          shards/shard-4.json shards/shard-5.json shards/shard-6.json
      - name: coverage >= 70 on the union of the shards
        run: |
          .venv/bin/coverage combine --keep shards/shard-*.coverage
          .venv/bin/coverage report --fail-under=70
          .venv/bin/coverage xml -o coverage.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # a full artifact-storage quota is not a build failure
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Job budget (fails past 80 % of timeout-minutes)
        if: always()
        run: python3 scripts/ci_job_budget.py --timeout-minutes 10 --mode fail

  ui-unit:
    name: ui-unit (tsc -b + vitest, the hint ratchet included)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the UI
        working-directory: ui
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Types (tsc -b)
        working-directory: ui
        run: npm run typecheck
      - name: Unit tests (vitest — screens, help registry, hint ratchet, title= allowlist)
        working-directory: ui
        run: npx vitest run

  ui-smoke:
    # quoted: an unquoted YAML scalar may not contain ": "
    name: "ui-smoke (mocked browser: axe on /login, the index redirect, the 404)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the UI + Playwright Chromium (with system deps)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Smoke (ui/e2e/smoke.spec.ts — the config builds the bundle and serves it)
        working-directory: ui
        env:
          CI: "1"
        run: npx playwright test
      - name: Upload the Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # a full artifact-storage quota is not a build failure
        with:
          name: ui-smoke-playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: security (gitleaks + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits through the API on PR events;
      # without this it fails 403 "Resource not accessible by integration" (first seen on
      # PR #7, 2026-09-15 — pushes to a branch never needed it)
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        # The action's default scanner (8.24.3) predates the top-level ``[[allowlists]]``
        # form the config uses, so the test tree's deliberately fake credentials were 18
        # "findings" (first CI run after the repository went public, 2026-09-16). Pin the
        # scanner the gate runs — the version that read the config correctly locally.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for organisation-owned repositories; harmless when unset.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # the verdict is the step's exit code; the report upload is what fails when the
          # account's artifact-storage quota is full (2026-09-15)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install the resolved DEPENDENCY environment (every extra; not the project itself)
        # The project is deliberately not installed: it is not on an index, and an
        # un-auditable distribution would trip --strict. We audit what crb depends on.
        run: |
          uv venv -q .audit --python 3.12
          uv pip install -q -r pyproject.toml \
            --extra openai --extra claude --extra server --extra postgres --extra mcp --extra dev \
            --python .audit/bin/python
          uv pip install -q pip pip-audit --python .audit/bin/python
      - name: Record the resolved environment
        run: |
          uv pip freeze --python .audit/bin/python > resolved-requirements.txt
          wc -l resolved-requirements.txt
      - name: pip-audit (resolved environment, strict)
        run: >-
          .audit/bin/pip-audit
          --strict
          --desc on
          --progress-spinner off
      - name: Upload resolved requirements
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # a full artifact-storage quota is not a build failure
        with:
          name: resolved-requirements
          path: resolved-requirements.txt
          retention-days: 7

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install the resolved environment (every extra) + cyclonedx-bom
        run: |
          uv venv -q .venv --python 3.12
          uv pip install -q -e '.[openai,claude,server,postgres,dev]' --python .venv/bin/python
          uv pip install -q cyclonedx-bom --python .venv/bin/python
      - name: Generate SBOM (CycloneDX JSON of the environment; root component from pyproject)
        run: >-
          .venv/bin/cyclonedx-py environment
          --pyproject pyproject.toml
          --output-format JSON
          --output-file sbom.cdx.json
          .venv/bin/python
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        continue-on-error: true  # a full artifact-storage quota is not a build failure
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 7

  test-postgres:
    name: test-postgres (store suite on PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crb
          POSTGRES_PASSWORD: crb
          POSTGRES_DB: crb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crb -d crb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CRB_TEST_POSTGRES_URL: postgresql+psycopg://crb:crb@127.0.0.1:5432/crb_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install (server + postgres + dev extras)
        run: |
          uv venv -q .venv --python 3.12
          uv pip install -q -e '.[server,postgres,mcp,dev]' --python .venv/bin/python
      - name: pytest — store suite, SQLite AND PostgreSQL parametrisations
        # The same assertions run on both dialects. A skip here would hide a divergence, so
        # the step fails if the postgres parametrisation was skipped for any reason.
        run: |
          .venv/bin/pytest -q tests/test_store_db.py tests/test_store_ledger.py tests/test_store_migrate.py \
            -rs --junitxml=store-postgres.xml
          if grep -q 'CRB_TEST_POSTGRES_URL not set' store-postgres.xml; then
            echo '::error::postgres parametrisation was skipped'; exit 1
          fi
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # a full artifact-storage quota is not a build failure
        with:
          name: store-postgres-junit
          path: store-postgres.xml
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: container (docker build + smoke + helm lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: hadolint deploy/Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deploy/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build deploy/Dockerfile (no push; GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: crb:ci
          # the served-commit stamp (src/crb/observability/build_stamp.py): the context has no .git
          build-args: CRB_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Smoke the image — non-root, read-only root, migrate on SQLite, UI + tools present
        # tmpfs ownership is explicit: newer daemons make --tmpfs inherit the image
        # directory's root:0750, which uid 10001 cannot write ("unable to open database
        # file" — the ubuntu-latest runner in CI run 34780605823 and Docker 29 / colima alike).
        run: |
          set -euo pipefail
          docker run --rm crb:ci python -c "import os; assert os.getuid() == 10001, os.getuid(); print('uid ok')"
          docker run --rm --read-only --tmpfs /tmp --tmpfs /srv/crb:rw,uid=10001,gid=10001,mode=0750 crb:ci migrate upgrade -v
          docker run --rm --read-only --tmpfs /tmp --tmpfs /srv/crb:rw,uid=10001,gid=10001,mode=0750 crb:ci migrate current
          docker run --rm crb:ci python -c "import os; assert os.path.isfile('/app/ui/dist/index.html'), 'UI missing from image'; print('ui ok')"
          docker run --rm crb:ci sh -c 'command -v docker && command -v git && test -x /usr/local/bin/crb-entrypoint'
          docker run --rm crb:ci python -c "import crb.store.migrate, crb.core, crb.builders; print('imports ok')"
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: helm lint (strict) + template every sandbox / postgres mode
        run: |
          helm lint deploy/helm/crb --strict
          # external postgres (the default) must name its CIDR under the default-deny policy
          helm template crb deploy/helm/crb --set 'networkPolicy.postgres.cidrs={10.0.0.0/8}' > /dev/null
          helm template crb deploy/helm/crb --set worker.sandbox.mode=dind --set postgresql.mode=embedded --set ingress.enabled=true > /dev/null
          helm template crb deploy/helm/crb --set worker.sandbox.mode=hostSocket --set worker.workDir.type=emptyDir --set 'networkPolicy.postgres.cidrs={10.0.0.0/8}' > /dev/null
          # the chart refuses the two silent misconfigurations (an unreachable database, two workers on one RWO volume)
          if helm template crb deploy/helm/crb > /dev/null 2>&1; then echo "expected render failure: external postgres without cidrs"; exit 1; fi
          if helm template crb deploy/helm/crb --set postgresql.mode=embedded --set worker.replicaCount=2 > /dev/null 2>&1; then echo "expected render failure: replicaCount=2 on RWO"; exit 1; fi
          # one secrets store for the api and the worker (P-043): an operator's claim renders; a
          # mode two pods cannot share is refused
          helm template crb deploy/helm/crb --set 'networkPolicy.postgres.cidrs={10.0.0.0/8}' --set secretsStore.existingClaim=kv-secrets --set secretsStore.accessMode=ReadWriteMany > /dev/null
          if helm template crb deploy/helm/crb --set postgresql.mode=embedded --set secretsStore.accessMode=ReadWriteOncePod > /dev/null 2>&1; then echo "expected render failure: a ReadWriteOncePod secrets store"; exit 1; fi
          # the pin puts the api on the worker's node: a worker-only tainted pool is refused (P-046)
          if helm template crb deploy/helm/crb --set postgresql.mode=embedded --set 'worker.tolerations[0].key=crb.dev/worker' --set 'worker.tolerations[0].operator=Exists' > /dev/null 2>&1; then echo "expected render failure: api cannot follow the worker's placement"; exit 1; fi
          if helm template crb deploy/helm/crb --set postgresql.mode=embedded --set 'worker.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key=crb.dev/pool' --set 'worker.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator=Exists' > /dev/null 2>&1; then echo "expected render failure: api cannot follow the worker's node affinity"; exit 1; fi
          if helm template crb deploy/helm/crb --set postgresql.mode=embedded --set 'api.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels.app\.kubernetes\.io/component=worker' --set 'api.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey=kubernetes.io/hostname' --set 'worker.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels.app\.kubernetes\.io/component=worker' --set 'worker.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey=kubernetes.io/hostname' > /dev/null 2>&1; then echo "expected render failure: anti-affinity that repels a pod the store pin places"; exit 1; fi
      - name: docker compose config
        run: |
          printf 'POSTGRES_PASSWORD=ci\nCRB_SECRET_KEY=ci\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
          rm -f deploy/.env

  sandbox-images:
    name: sandbox-images (build + hadolint + smoke each reference sandbox image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A reference image that does not build, or a fixture that does not pass inside it,
      # is a repository defect: fail, never skip.
      CRB_TEST_STRICT_WARMUP: "1"
      CRB_TEST_SANDBOX_IMAGE_PYTHON: crb-sandbox-python:ci
      CRB_TEST_SANDBOX_IMAGE_NODE: crb-sandbox-node:ci
      CRB_TEST_SANDBOX_IMAGE_GO: crb-sandbox-go:ci
      # the sandbox + sealed-builder suites run on the shipped python image, not the inline one
      CRB_TEST_SANDBOX_IMAGE: crb-sandbox-python:ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: hadolint deploy/sandbox/Dockerfile.python
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deploy/sandbox/Dockerfile.python
      - name: hadolint deploy/sandbox/Dockerfile.node
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deploy/sandbox/Dockerfile.node
      - name: hadolint deploy/sandbox/Dockerfile.go
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deploy/sandbox/Dockerfile.go
      - uses: docker/setup-buildx-action@v4
      - name: Build deploy/sandbox/Dockerfile.python (no push; GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile.python
          push: false
          load: true
          tags: crb-sandbox-python:ci
          cache-from: type=gha,scope=sandbox-python
          cache-to: type=gha,mode=max,ignore-error=true,scope=sandbox-python
      - name: Build deploy/sandbox/Dockerfile.node (no push; GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile.node
          push: false
          load: true
          tags: crb-sandbox-node:ci
          cache-from: type=gha,scope=sandbox-node
          cache-to: type=gha,mode=max,ignore-error=true,scope=sandbox-node
      - name: Build deploy/sandbox/Dockerfile.go (no push; GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile.go
          push: false
          load: true
          tags: crb-sandbox-go:ci
          cache-from: type=gha,scope=sandbox-go
          cache-to: type=gha,mode=max,ignore-error=true,scope=sandbox-go
      - name: Image facts — default user, size, the toolchain answers under read-only root + no network
        run: |
          set -euo pipefail
          for lang in python node go; do
            img="crb-sandbox-${lang}:ci"
            printf '%s: user=%s size=%s\n' "$img" "$(docker image inspect --format '{{.Config.User}}' "$img")" "$(docker image inspect --format '{{.Size}}' "$img")"
            test "$(docker run --rm --network=none --read-only --tmpfs /tmp "$img" id -u)" = "65534"
          done
          docker run --rm --network=none --read-only --tmpfs /tmp crb-sandbox-python:ci python -m pytest --version
          docker run --rm --network=none --read-only --tmpfs /tmp crb-sandbox-node:ci node --version
          docker run --rm --network=none --read-only --tmpfs /tmp crb-sandbox-go:ci go version
      - name: Pre-pull the dependency fetch images by digest (ADR-0019; the worker never pulls)
        run: |
          set -euo pipefail
          docker pull -q golang:1.26.8-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d
          docker pull -q python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
          docker pull -q node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
      # the D5 regression grades the same tree on the host posture too
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install (server + dev extras)
        run: |
          uv venv -q .venv --python 3.12
          uv pip install -q -e '.[server,dev]' --python .venv/bin/python
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.email "ci@crb.invalid"
          git config --global user.name "crb ci"
          git config --global init.defaultBranch main
      - name: Smoke — each language's fixture through DockerExecutor on its image; the sandbox + sealed-builder suites on the python one
        # -rs: a skip here would be an image that was not tested; the step fails if any test
        # in these modules was skipped for any reason.
        run: |
          .venv/bin/pytest -q -rs tests/test_sandbox_images_docker.py tests/test_sandbox_docker.py \
            tests/test_builders_container_docker.py tests/test_provision_fetch.py \
            tests/test_provision_go.py tests/test_provision_python.py tests/test_provision_node.py \
            tests/test_posture_e2e_docker.py \
            -m "not network" --junitxml=sandbox-images.xml
          if grep -q '<skipped' sandbox-images.xml; then
            echo '::error::a sandbox image test was skipped'; grep -o '<skipped[^>]*>' sandbox-images.xml; exit 1
          fi
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # a full artifact-storage quota is not a build failure
        with:
          name: sandbox-images-junit
          path: sandbox-images.xml
          if-no-files-found: ignore
          retention-days: 7

  walkthrough-story:
    name: walkthrough story (browser, live stack, tier 1)
    runs-on: ubuntu-latest
    # The tier-1 walk grew past its budget twice: 25 minutes (run 35741391422, cancelled at
    # 25m18s) and then 40 (PR #57, cancelled twice at 40 minutes with every spec so far
    # passing) — 11-screens alone was ~34 of them (8 persona x width passes at ~4.3 min each).
    # So the job was split, not raised: this one runs the stateful story (every spec but
    # 11-screens, ~9-12 min on a hosted runner) and `walkthrough-screens` runs 11-screens as
    # four parallel shards; `walkthrough` below keeps the required context and passes only
    # when all of them did. The guard at the end fails the job past 80 % of this budget; if
    # a future wave needs more, split again — a gate nobody can finish is not a gate.
    timeout-minutes: 40
    steps:
      - name: Start the job-budget clock
        run: echo "CRB_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install crb (server + dev extras)
        run: |
          uv venv -q .venv --python 3.12
          uv pip install -q -e '.[server,dev]' --python .venv/bin/python
      - name: Install the UI + Playwright Chromium (with system deps)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Build the UI bundle the API serves
        working-directory: ui
        run: npm run build
      - name: Configure git identity for the fixture repository
        run: |
          git config --global user.email "ci@crb.invalid"
          git config --global user.name "crb ci"
          git config --global init.defaultBranch main
      - name: Walkthrough — the stateful story (every spec but 11-screens), on a fresh stack
        # Hermetic: no network (file:// fixture, pinned interpreter), no model (fixture_gold),
        # a temp CRB_HOME + SQLite on a free port. The report is pointed into ui/ for upload.
        # --grep-invert matches the file name, so a spec added later runs here by default.
        env:
          CI: "1"
          CRB_E2E_REPORT_DIR: ${{ github.workspace }}/ui/playwright-report-walkthrough
          CRB_E2E_OUTPUT_DIR: ${{ github.workspace }}/ui/test-results-walkthrough
        run: scripts/walkthrough.sh --grep-invert '11-screens\.spec\.ts'
      - name: Upload the Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # a full artifact-storage quota is not a build failure
        with:
          name: walkthrough-playwright-report
          path: |
            ui/playwright-report-walkthrough
            ui/test-results-walkthrough
          if-no-files-found: ignore
          retention-days: 7
      - name: Job budget (fails past 80 % of timeout-minutes)
        if: always()
        run: python3 scripts/ci_job_budget.py --timeout-minutes 40 --mode fail

  walkthrough-screens:
    # 11-screens, every route x persona x width, one persona per shard (k/4 takes every 4th
    # persona from the k-th, so the four shards are every persona by construction). Each shard
    # boots its own stack and the spec's first test seeds the primary repository through the
    # API (onboard, probe, mine, oracle, controls, a two-task fixture_gold replay) — it never
    # assumes state the `walkthrough-story` job made. ~8.5 min of passes + ~1.5 min seed + ~1 min
    # setup on a hosted runner, estimated from PR #57's log: under half of this budget.
    name: walkthrough screens (browser, live stack, tier 1, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Start the job-budget clock
        run: echo "CRB_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install crb (server + dev extras)
        run: |
          uv venv -q .venv --python 3.12
          uv pip install -q -e '.[server,dev]' --python .venv/bin/python
      - name: Install the UI + Playwright Chromium (with system deps)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Build the UI bundle the API serves
        working-directory: ui
        run: npm run build
      - name: Configure git identity for the fixture repository
        run: |
          git config --global user.email "ci@crb.invalid"
          git config --global user.name "crb ci"
          git config --global init.defaultBranch main
      - name: 11-screens for this shard's personas, on a fresh stack the spec seeds
        env:
          CI: "1"
          CRB_E2E_SCREENS_SHARD: ${{ matrix.shard }}/4
          CRB_E2E_REPORT_DIR: ${{ github.workspace }}/ui/playwright-report-walkthrough
          CRB_E2E_OUTPUT_DIR: ${{ github.workspace }}/ui/test-results-walkthrough
        run: scripts/walkthrough.sh e2e/walkthrough/11-screens.spec.ts
      - name: Upload the Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # a full artifact-storage quota is not a build failure
        with:
          name: walkthrough-screens-playwright-report-${{ matrix.shard }}
          path: |
            ui/playwright-report-walkthrough
            ui/test-results-walkthrough
          if-no-files-found: ignore
          retention-days: 7
      - name: Job budget (fails past 80 % of timeout-minutes)
        if: always()
        run: python3 scripts/ci_job_budget.py --timeout-minutes 25 --mode fail

  walkthrough:
    # The required context. Main's branch protection lists "walkthrough (browser, live stack,
    # tier 1)" and nothing else for the walkthrough, so the split parts report under names of
    # their own and this job carries the required one: it passes only when every part passed.
    # `if: always()` so it runs — and fails — when a part failed or was cancelled: a skipped
    # job would leave the required context skipped, and a skipped required check does not
    # block a merge. tests/test_ci_job_budget.py holds `needs` equal to every job that runs
    # scripts/walkthrough.sh, so a part added later cannot run outside the required check.
    name: walkthrough (browser, live stack, tier 1)
    needs: [walkthrough-story, walkthrough-screens]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the walkthrough passed (story + every screens shard)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | length > 0 and all(.value.result == "success")'
