# Dependabot: weekly updates for Python dependencies (pyproject.toml) and GitHub Actions.
# Security updates are always enabled regardless of schedule.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "import-linter", "hypothesis"]
      server:
        patterns: ["fastapi", "uvicorn*", "sqlalchemy", "alembic", "pydantic*", "authlib", "httpx", "itsdangerous", "prometheus-client", "python-multipart", "sse-starlette", "argon2-cffi", "psycopg*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    # One PR per week for every action bump — a major action version cannot be exercised
    # without CI minutes, so they are reviewed and merged together, not as six branches.
    groups:
      github-actions:
        patterns: ["*"]
