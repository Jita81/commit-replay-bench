apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crb.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "crb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "crb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- include "crb.secretsStore.podLabel" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "crb.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "crb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            {{- include "crb.envFrom" . | nindent 12 }}
          env:
            {{- include "crb.commonEnv" . | nindent 12 }}
            # This pod is the API: the sandbox is the worker's instrument, so the deep
            # /health probe reports it `skipped` here (never degraded/down for a docker
            # socket this pod is not meant to have). See src/crb/server/routes/system.py.
            - name: CRB_ROLE
              value: "api"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Liveness = the process is up and its database answers (/health/live: one
          # probe). Readiness = the deep probe (/health: store, ledger honesty floor,
          # toolchains, builders, worker heartbeat). A liveness probe on the deep
          # endpoint would restart a healthy pod for a dependency it does not own.
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "crb.scratchMounts" . | nindent 12 }}
            - name: data
              mountPath: /srv/crb
            {{- include "crb.secretsStore.mount" . | nindent 12 }}
      volumes:
        {{- include "crb.scratchVolumes" . | nindent 8 }}
        {{- /* the secrets store the worker reads (CRB_SECRETS_DIR): one claim for both pods */}}
        {{- include "crb.secretsStore.volume" . | nindent 8 }}
        # Scratch for exports. Evidence lives in the database; the stored credentials live
        # in the secrets store above, never here.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "crb.secretsStore.affinity" (dict "root" $ "affinity" .Values.api.affinity) }}
      {{- . | nindent 6 }}
      {{- end }}
---
{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "crb.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "crb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
