{{- if not .Values.secretsStore.existingClaim }}
# The secrets store (CRB_SECRETS_DIR) the api writes and the worker reads — one claim, both
# pods (docs/PREVENTION.md P-043). No helm.sh/resource-policy: keep — a stored credential
# does not outlive the release; `helm uninstall` removes it with the pods that used it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "crb.secretsStore.claim" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crb.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-store
spec:
  accessModes:
    - {{ .Values.secretsStore.accessMode }}
  {{- with .Values.secretsStore.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.secretsStore.size }}
{{- end }}
