# Alembic configuration for crb.store — used by ``crb.store.migrate`` (programmatic) and by
# ``alembic -c src/crb/store/alembic.ini <cmd>`` (developer CLI).
#
# There is deliberately NO ``sqlalchemy.url`` here: the URL comes from
# ``crb.store.migrate.upgrade(url)``, ``-x url=…``, or ``CRB_DATABASE_URL`` (see
# migrations/env.py), so a database URL — which may embed a password — never lives in
# a checked-in file. Logging is left to the caller for the same reason: ``fileConfig``
# would silently reconfigure the server's JSON logging when migrations run in-process.

[alembic]
script_location = %(here)s/migrations
# ``v<rev>_<slug>.py`` keeps every revision a valid Python module name (mypy scans them).
file_template = v%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os
