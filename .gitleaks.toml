# gitleaks configuration for crb.
# Extends the default ruleset; allowlists ONLY the test tree by path, where redaction tests
# deliberately contain fake tokens (crb.core.redact must recognise the shapes).
# No path under src/, docs/ or deploy/ is allowlisted; elsewhere only an exact secret shape
# is, each with its reason below. Anything else that trips a rule is a finding, not a false
# positive, until proven otherwise in review. tests/test_gitleaks_config.py pins every entry
# below by its shape (EXPECTED_ALLOWLISTS): add, change or remove one there too, with its reason.

title = "crb gitleaks config"
# The top-level [[allowlists]] form needs gitleaks >= 8.25; CI pins 8.30.1 (GITLEAKS_VERSION).
minVersion = "8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures and redaction tests contain deliberately fake credentials"
paths = [
  '''^tests/''',
]

[[allowlists]]
# A content hash, not a credential: the dependency store keys a provisioned bundle by
# "dep_" + a sha256 hex digest (crb.core.provision.bundle_key), the shape the product itself
# defines in crb.core.deps.KEY_RE. Committed review evidence carries such keys under "...key"
# fields, which generic-api-key reads as API keys: first seen on #56's push 406ff747 (main's
# security job red on 2026-09-26 (UTC), unnoticed), then on every pull request whose scan
# range reaches that commit (PR #75, 2026-10-08). The regex is matched against the captured
# secret (the default regexTarget) and anchored, so it passes one whole key and nothing longer,
# shorter or around it, and only for generic-api-key. It is KEY_RE's own pattern, string for
# string: tests/test_gitleaks_config.py fails when the two differ (docs/PREVENTION.md P-675).
description = "Dependency-store keys: dep_ + a sha256 hex digest (crb.core.deps.KEY_RE)"
targetRules = ["generic-api-key"]
regexes = [
  '''^dep_[0-9a-f]{64}$''',
]

[[allowlists]]
# A public label, not a credential: ADR-0025 derives the ledger anchor's key as
# HMAC(key, "crb.ledger.anchor.v1") from CRB_SECRET_KEY. The label is a fixed domain-separation
# string, published in the ADR by design; the secret is the key, never the label.
# generic-api-key captured the label as an API key on #69's push 435d2a49 (main's security job
# red on 2026-10-08 (UTC)). Literal and anchored, so it passes this one label and nothing
# around it, and only for generic-api-key: tests/test_gitleaks_config.py requires the regex to
# be "^" + re.escape(the label ADR-0025 derives the key from) + "$" (docs/PREVENTION.md P-675).
description = "ADR-0025's ledger-anchor HMAC label (a public domain-separation string)"
targetRules = ["generic-api-key"]
regexes = [
  '''^crb\.ledger\.anchor\.v1$''',
]

[[allowlists]]
description = "Documentation placeholders that are obviously not credentials"
regexTarget = "match"
regexes = [
  '''(?i)\[REDACTED[A-Z-]*\]''',
  '''(?i)sk-(?:live|test|proj|ant)?-?x{8,}''',
  '''(?i)(?:secret|token|password|api[_-]?key)\s*[=:]\s*<[^>]+>''',
]
