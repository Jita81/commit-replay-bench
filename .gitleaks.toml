# gitleaks configuration for crb.
# Extends the default ruleset; allowlists ONLY the test tree, where redaction tests
# deliberately contain fake tokens (crb.core.redact must recognise the shapes).
# Nothing under src/, docs/ or deploy/ is allowlisted. Anything else that trips a rule
# is a finding, not a false positive, until proven otherwise in review.

title = "crb gitleaks config"
# The top-level [[allowlists]] form needs gitleaks >= 8.25; CI pins 8.30.1 (GITLEAKS_VERSION).
minVersion = "8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures and redaction tests contain deliberately fake credentials"
paths = [
  '''^tests/''',
]

[[allowlists]]
description = "Documentation placeholders that are obviously not credentials"
regexTarget = "match"
regexes = [
  '''(?i)\[REDACTED[A-Z-]*\]''',
  '''(?i)sk-(?:live|test|proj|ant)?-?x{8,}''',
  '''(?i)(?:secret|token|password|api[_-]?key)\s*[=:]\s*<[^>]+>''',
]
