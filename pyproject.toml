[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-replay-bench"
version = "0.1.0"
description = "Grade an AI coding agent against a repo's own tests — the honest, overfit-proof coding eval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jita81" }]
keywords = ["llm", "evaluation", "benchmark", "coding-agent", "agentic", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []  # the core engine is standard-library only

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
commit-replay = "commit_replay_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_replay_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
