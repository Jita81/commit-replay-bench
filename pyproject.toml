[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license-files array
build-backend = "hatchling.build"

[project]
name = "commit-replay-bench"
version = "2.0.0a1"
description = "Commit Replay Bench — grade an AI builder against a repository's own held-out tests, ledger every verdict, route change-classes on measured evidence, and manufacture new work under the same governance."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Automated Agile", email = "paul@automatedagile.co.uk" }]
keywords = ["benchmark", "commit-replay", "software-factory", "ai-coding", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
# The core engine is STANDARD-LIBRARY ONLY (enforced by import-linter in CI).
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
claude = ["claude-agent-sdk>=0.1"]
mcp = ["mcp>=2.0", "httpx>=0.27"]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "argon2-cffi>=23.1",
]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  # The gate tools are pinned exactly: a range lets a fresh environment and CI disagree
  # about the same tree. Dependabot's dev-tooling group moves them (.github/dependabot.yml).
  "ruff==0.16.9",
  "mypy==2.3.1",
  "import-linter>=2.0",
  "hypothesis>=6.100",
  # the CommonMark parser scripts/claims_check.py reads fence spans with (CI's claims
  # job installs the same package)
  "markdown-it-py>=3.0",
]
all = ["commit-replay-bench[openai,claude,server,postgres,mcp,dev]"]

[project.scripts]
crb = "crb.cli.main:main"

[project.urls]
Homepage = "https://github.com/Jita81/commit-replay-bench"

[tool.hatch.build.targets.wheel]
packages = ["src/crb"]

# ---------------------------------------------------------------------------
# Lint / type / test configuration
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "PL"]
ignore = [
  "S101",   # asserts are fine in tests and as poka-yoke checks
  "S603",   # subprocess without shell — we never use shell=True; argv is constructed
  "S607",   # partial executable path (git/docker resolved via PATH by design)
  "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911",
  "E501",   # ruff format handles line length
  "S108",   # /tmp paths are INSIDE the sandbox container by design
  "N818",   # FalseQ1Violation / SandboxUnavailable are deliberate, documented names
  "RUF002", "RUF003", # unicode (×, σ, ⇒) in docstrings/comments is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL", "B011"]
# the CLI imports the optional server/store layers lazily so the base install works
"src/crb/cli/commands/service.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/crb"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openai.*", "claude_agent_sdk.*", "authlib.*", "sse_starlette.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -p no:cacheprovider"
timeout = 600
markers = [
  "docker: needs a reachable docker daemon",
  "toolchain(name): needs a language toolchain on PATH (go, node, mvn, cargo)",
  "live: needs live model credentials (skipped in CI)",
  "slow: long-running end-to-end test",
  "network(*hosts): needs outbound HTTPS to each named host (none: the Python package index); skipped with the reason when one is unreachable, a failure under CRB_TEST_STRICT_WARMUP=1 (tests/conftest.py)",
  "sandbox_images: builds and smokes the shipped reference sandbox images (deploy/sandbox); CI runs these in the sandbox-images job",
]

[tool.coverage.run]
source = ["crb"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
# Architecture contract: crb.core imports nothing outside the standard library
# and the layers only depend downward. Checked by `lint-imports` in CI.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "crb"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "crb.core is standard-library only"
type = "forbidden"
source_modules = ["crb.core"]
forbidden_modules = [
  "crb.builders", "crb.store", "crb.server", "crb.factory", "crb.cli", "crb.mcp",
  "crb.observability",
  "openai", "anthropic", "claude_agent_sdk", "sqlalchemy", "alembic", "fastapi", "pydantic",
  "httpx", "requests", "yaml", "authlib", "prometheus_client", "mcp",
]

[[tool.importlinter.contracts]]
name = "layers depend downward only"
type = "layers"
# Parenthesised layers are optional: packages land phase by phase (cli/server/factory/store).
layers = [
  "(crb.cli)",
  "(crb.mcp)",
  "(crb.server)",
  "(crb.intake)",
  "(crb.factory)",
  "(crb.store)",
  "(crb.builders) | crb.observability",
  "crb.core",
]
